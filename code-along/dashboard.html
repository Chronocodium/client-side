<!doctype html>
<html lang="en" class="h-full">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Cacher's Deliveries Dashboard</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap"
            rel="stylesheet"
        />
        <link href="./src/output.css" rel="stylesheet" />
    </head>
    <body class="bg-slate-100 flex flex-col md:flex-row h-screen">
        <!-- Navbar -->
        <div class="bg-slate-700 text-white">
            <div
                class="flex gap-8 pb-6 h-full justify-between md:justify-center md:flex-col md:py-4 items-center"
            >
                <a href="/"
                    ><img
                        src="images/Cachers.png"
                        alt="logo"
                        class="w-14 h-14 rounded-full object-cover"
                /></a>
                <button
                    id="menu-toggle"
                    class="p-4 text-slate-400 hover:text-slate-200 active:text-slate-200 md:hidden"
                >
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        class="w-8 h-8"
                        width="24"
                        height="24"
                        viewBox="0 0 24 24"
                        stroke-width="2"
                        stroke="currentColor"
                        fill="none"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                        <path d="M4 6l16 0" />
                        <path d="M4 12l16 0" />
                        <path d="M4 18l16 0" />
                    </svg>
                </button>
                <nav
                    is="menu"
                    class="hidden md:h-[calc(100%-5.5rem)] md:flex md:flex-col md:justify-between md:w-52"
                >
                    <ul class="flex flex-col text-sm text-slate-400">
                        <li>
                            <a
                                href="#"
                                class="flex justify-between items-center p-4 hover:bg-slate-600 hover:text-slate-200"
                                ><span>Dashboard</span
                                ><svg
                                    xmlns="http://www.w3.org/2000/svg"
                                    width="16"
                                    height="16"
                                    fill="currentColor"
                                    class="bi bi-chevron-right"
                                    viewBox="0 0 16 16"
                                >
                                    <path
                                        fill-rule="evenodd"
                                        d="M4.646 1.646a.5.5 0 0 1 .708 0l6 6a.5.5 0 0 1 0 .708l-6 6a.5.5 0 0 1-.708-.708L10.293 8 4.646 2.354a.5.5 0 0 1 0-.708z"
                                    /></svg
                            ></a>
                        </li>
                        <li>
                            <a
                                href="#"
                                class="flex justify-between items-center p-4 hover:bg-slate-600 hover:text-slate-200"
                                ><span>Analytics</span
                                ><svg
                                    xmlns="http://www.w3.org/2000/svg"
                                    width="16"
                                    height="16"
                                    fill="currentColor"
                                    class="bi bi-chevron-right"
                                    viewBox="0 0 16 16"
                                >
                                    <path
                                        fill-rule="evenodd"
                                        d="M4.646 1.646a.5.5 0 0 1 .708 0l6 6a.5.5 0 0 1 0 .708l-6 6a.5.5 0 0 1-.708-.708L10.293 8 4.646 2.354a.5.5 0 0 1 0-.708z"
                                    /></svg
                            ></a>
                        </li>
                        <li>
                            <a
                                href="#"
                                class="flex justify-between items-center p-4 hover:bg-slate-600 hover:text-slate-200"
                                ><span>Ecommerce</span
                                ><svg
                                    xmlns="http://www.w3.org/2000/svg"
                                    width="16"
                                    height="16"
                                    fill="currentColor"
                                    class="bi bi-chevron-right"
                                    viewBox="0 0 16 16"
                                >
                                    <path
                                        fill-rule="evenodd"
                                        d="M4.646 1.646a.5.5 0 0 1 .708 0l6 6a.5.5 0 0 1 0 .708l-6 6a.5.5 0 0 1-.708-.708L10.293 8 4.646 2.354a.5.5 0 0 1 0-.708z"
                                    /></svg
                            ></a>
                        </li>
                        <li>
                            <a
                                href="#"
                                class="flex justify-between items-center p-4 hover:bg-slate-600 hover:text-slate-200"
                                ><span>Products</span
                                ><svg
                                    xmlns="http://www.w3.org/2000/svg"
                                    width="16"
                                    height="16"
                                    fill="currentColor"
                                    class="bi bi-chevron-right"
                                    viewBox="0 0 16 16"
                                >
                                    <path
                                        fill-rule="evenodd"
                                        d="M4.646 1.646a.5.5 0 0 1 .708 0l6 6a.5.5 0 0 1 0 .708l-6 6a.5.5 0 0 1-.708-.708L10.293 8 4.646 2.354a.5.5 0 0 1 0-.708z"
                                    /></svg
                            ></a>
                        </li>
                        <li>
                            <a
                                href="#"
                                class="flex justify-between items-center p-4 hover:bg-slate-600 hover:text-slate-200"
                                ><span>Email</span
                                ><svg
                                    xmlns="http://www.w3.org/2000/svg"
                                    width="16"
                                    height="16"
                                    fill="currentColor"
                                    class="bi bi-chevron-right"
                                    viewBox="0 0 16 16"
                                >
                                    <path
                                        fill-rule="evenodd"
                                        d="M4.646 1.646a.5.5 0 0 1 .708 0l6 6a.5.5 0 0 1 0 .708l-6 6a.5.5 0 0 1-.708-.708L10.293 8 4.646 2.354a.5.5 0 0 1 0-.708z"
                                    /></svg
                            ></a>
                        </li>
                        <li>
                            <a
                                href="#"
                                class="flex justify-between items-center p-4 hover:bg-slate-600 hover:text-slate-200"
                                ><span>Shipping</span
                                ><svg
                                    xmlns="http://www.w3.org/2000/svg"
                                    width="16"
                                    height="16"
                                    fill="currentColor"
                                    class="bi bi-chevron-right"
                                    viewBox="0 0 16 16"
                                >
                                    <path
                                        fill-rule="evenodd"
                                        d="M4.646 1.646a.5.5 0 0 1 .708 0l6 6a.5.5 0 0 1 0 .708l-6 6a.5.5 0 0 1-.708-.708L10.293 8 4.646 2.354a.5.5 0 0 1 0-.708z"
                                    /></svg
                            ></a>
                        </li>
                    </ul>
                    <!-- Profile -->
                    <a
                        href="#"
                        class="flex justify-between items-center px-4 text-slate-400 text-sm hover:bg-slate-600 hover:text-slate-200 py-2"
                        ><div class="flex items-center">
                            <img
                                src="images/profile.jpg"
                                alt="profile"
                                class="w-12 h-12 rounded-full object-cover mr-4"
                            />
                        </div>
                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            width="16"
                            height="16"
                            fill="currentColor"
                            class="bi bi-chevron-right"
                            viewBox="0 0 16 16"
                        >
                            <path
                                fill-rule="evenodd"
                                d="M4.646 1.646a.5.5 0 0 1 .708 0l6 6a.5.5 0 0 1 0 .708l-6 6a.5.5 0 0 1-.708-.708L10.293 8 4.646 2.354a.5.5 0 0 1 0-.708z"
                            /></svg
                    ></a>
                </nav>
            </div>
        </div>
        <main class="flex-1 p-4">
            <!-- Cards Section -->
            <div
                class="flex flex-col justify-center py-4 sm:flex-row flex-wrap gap-4 text-slate-800 w-full"
            >
                <!-- Card Start -->
                <div
                    class="bg-white w-full px-4 py-2 rounded-xl shadow min-w-56 sm:max-w-80"
                >
                    <span class="text-slate-400 text-sm">Ad Spend</span>
                    <div class="my-8 w-full">
                        <div class="flex justify-center mb-2">
                            <span class="text-2xl mr-1 mt-1">$</span>
                            <span class="text-6xl font-bold">65.47</span>
                        </div>
                        <p class="text-green-500 text-xl text-center">
                            <span>&#x2193;</span>120%
                        </p>
                        <p class="text-sm text-center text-slate-400 mb-4">
                            Vs previous 30 days
                        </p>
                    </div>
                </div>
                <!-- Card End -->
                <!-- Card Start -->
                <div
                    class="bg-white w-full px-4 py-2 rounded-xl shadow min-w-56 sm:max-w-80"
                >
                    <span class="text-slate-400 text-sm"
                        >Cost Per Thousand (CPM)</span
                    >
                    <div class="my-8 w-full">
                        <div class="flex justify-center mb-2">
                            <span class="text-2xl mr-1 mt-1">$</span>
                            <span class="text-6xl font-bold">284</span>
                        </div>
                        <p class="text-green-500 text-xl text-center">
                            <span>&#x2193;</span>$0.38
                        </p>
                        <p class="text-sm text-center text-slate-400 mb-4">
                            Vs previous 30 days
                        </p>
                    </div>
                </div>
                <!-- Card End -->
                <!-- Card Start -->
                <div
                    class="bg-white w-full px-4 py-2 rounded-xl shadow min-w-56 sm:max-w-80"
                >
                    <span class="text-slate-400 text-sm"
                        >Cost Per Click (CPC)</span
                    >
                    <div class="my-8 w-full">
                        <div class="flex justify-center mb-2">
                            <span class="text-2xl mr-1 mt-1">$</span>
                            <span class="text-6xl font-bold">0.12</span>
                        </div>
                        <p class="text-red-500 text-xl text-center">
                            <span>&#x2191;</span>$0.02
                        </p>
                        <p class="text-sm text-center text-slate-400 mb-4">
                            Vs previous 30 days
                        </p>
                    </div>
                </div>
                <!-- Card End -->
                <!-- Card Start -->
                <div
                    class="bg-white w-full px-4 py-2 rounded-xl shadow min-w-56 sm:max-w-80"
                >
                    <span class="text-slate-400 text-sm"
                        >Click-Through Rate (CTR)</span
                    >
                    <div class="my-8 w-full">
                        <div class="flex justify-center mb-2">
                            <span class="text-6xl font-bold">2.98</span>
                            <span class="text-2xl mr-1 mt-1">%</span>
                        </div>
                        <p class="text-green-500 text-xl text-center">
                            <span>&#x2191;</span>7%
                        </p>
                        <p class="text-sm text-center text-slate-400 mb-4">
                            Vs previous 30 days
                        </p>
                    </div>
                </div>
                <!-- Card End -->
            </div>
            <!-- Cards Section End -->
            <div class="w-full my-4 sm:px-8 max-w-[1394px] mx-auto">
                <img
                    src="images/data.png"
                    alt="sales chart"
                    class="rounded-xl shadow"
                />
            </div>
        </main>
    </body>
</html>
