<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Client-Side Development</title>
        <style>
            body {
                font-family:
                    system-ui,
                    -apple-system,
                    sans-serif;
                background: #0f172a;
                color: #f8fafc;
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
                margin: 0;
            }
            .card {
                background: #1e293b;
                padding: 2.5rem;
                border-radius: 12px;
                border: 1px solid #334155;
                max-width: 420px;
                width: 100%;
            }
            h1 {
                margin-top: 0;
                font-size: 1.5rem;
            }
            p {
                color: #94a3b8;
                margin-bottom: 1.5rem;
            }
            .links {
                display: flex;
                flex-direction: column;
                gap: 0.75rem;
            }
            a {
                display: block;
                padding: 0.875rem 1.25rem;
                background: #334155;
                color: #38bdf8;
                text-decoration: none;
                border-radius: 8px;
                font-weight: 600;
                transition: background 0.15s ease;
            }
            a:hover {
                background: #475569;
            }
        </style>
    </head>
    <body>
        <main class="card">
            <h1>Client-Side Development</h1>
            <p>Select an assignment track below:</p>
            <nav class="links">
                <a href="/code-along/">Code-Along Projects &rarr;</a>
                <a href="/personal-portfolio/">Personal Portfolio &rarr;</a>
            </nav>
        </main>
    </body>
</html>
